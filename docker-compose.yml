version: '3.8'

services:
  # DB Services
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 1. Auth Microservice
  auth-backend:
    build: ./auth-backend
    ports:
      - "4000:4000"
    env_file: 
      - ./auth-backend/.env 
    depends_on:
      - mongo

  # 2. Chat Microservice Instance 1
  chat-1:
    build: ./chat-backend
    ports:
      - "5000"
    environment:
      - INSTANCE_ID=1
    env_file: 
      - ./chat-backend/.env 
    depends_on:
      - mongo
      - redis

  # Chat Microservice Instance 2
  chat-2:
    build: ./chat-backend
    ports:
      - "5001"
    environment:
      - INSTANCE_ID=2
    env_file: 
      - ./chat-backend/.env 
    depends_on:
      - mongo
      - redis

  # 3. API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "5100:5100"
    depends_on:
      - auth-backend
      - chat-1
      - chat-2

  # 4. Next.js Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8080

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api-gateway
      - chat-1
      - chat-2
      - frontend

volumes:
  mongo-data: