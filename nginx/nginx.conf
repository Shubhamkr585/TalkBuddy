worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 8192; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream chat_servers { least_conn; server chat-1:5000; server chat-2:5000; }

  server {
    listen 80;

    location = /_verify {
      internal;
      proxy_pass http://auth-backend:4000/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location /socket.io/ {
      auth_request /_verify;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      proxy_pass http://chat_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/messages/ {
      auth_request /_verify;
      auth_request_set $uid $upstream_http_x_user_id;
      proxy_set_header X-User-Id $uid;
      proxy_set_header Host $host;
      proxy_pass http://api-gateway:5100;
    }

    location /api/ {
      proxy_set_header X-User-Id "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://api-gateway:5100;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass http://frontend:3000;
    }
  }
}